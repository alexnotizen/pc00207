<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BÀI 7 - TỪ MỚI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,"Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#eef4ff,#f9fbff);
  display:flex; justify-content:center; color:#202124;
}
.app{width:min(720px,94vw); padding:28px 0 36px}
h1{text-align:center;margin:0 0 8px;font-size:28px}
.subtitle{text-align:center;color:#666;margin-bottom:18px}
.progress{text-align:center;font-size:15px;color:#666;margin-bottom:14px}
.card-wrap{perspective:1200px; cursor:pointer}
.card{
  width:100%; height:489px; position:relative; transform-style:preserve-3d;
  transition:transform .55s ease;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:24px; background:white; box-shadow:0 12px 35px rgba(30,60,100,.15);
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  padding:30px; border:1px solid #e6eaf0; text-align:center;
}
.zh{
  color: #e53e3e;
  font-weight: bold;
}
/* Phóng to chữ Hán mặt trước lên 20% (140px -> 168px) */
.front .han{font-size:168px; line-height: 1.2;}
.front .hint{margin-top:28px;color:#999;font-size:28px}

.back{transform:rotateY(180deg); justify-content:flex-start; padding-top:20px; overflow-y:auto;}
/* Phóng to chữ Hán mặt sau lên 20% (90px -> 108px) */
.back .han{font-size:108px; margin-bottom:4px; line-height: 1.2;}
/* Phóng to phiên âm (Pinyin) lên 20% (54px -> 65px) */
.pinyin{font-size:65px;font-weight:700;color:#2b6cb0;margin-bottom:4px}
/* Phóng to từ loại lên 20% (24px -> 29px) */
.pos{font-size:29px;font-style:italic;color:#718096;margin-bottom:6px}
/* Phóng to nghĩa lên 20% (30px -> 36px) */
.meaning{font-size:36px;color:#2d3748;font-weight:500;margin-bottom:10px}
/* Phóng to note lên 20% (20px -> 24px) */
.note{font-size:24px;color:#4a5568;background:#f7fafc;padding:10px 14px;border-radius:12px;border-left:4px solid #cbd5e0;max-width:90%;margin:0 auto;line-height:1.4;text-align:left;}
.note i{font-style:italic;}
.controls{display:flex;gap:12px;justify-content:center;margin-top:22px}
button{
  border:0;border-radius:14px;padding:13px 20px;font-size:16px;
  cursor:pointer;background:#e9eef7;color:#233044;
}
button.primary{background:#2563eb;color:white}
button:hover{filter:brightness(.97)}
.extra{display:flex;justify-content:center;gap:10px;margin-top:14px}
.speak{background:#fff4d6}
.shuffle{background:#e9f8ef}
@media(max-width:520px){
 .app{padding-top:20px}.card{height:435px}
 .front .han{font-size:108px}
 .front .hint{font-size:22px}
 .back .han{font-size:72px}
 .pinyin{font-size:43px}
 .pos{font-size:24px}
 .meaning{font-size:29px}
 .note{font-size:19px; padding:8px 10px;}
 .controls button{padding:12px 14px}
}
</style>
</head>
<body>
<div class="app">
  <h1>🇨🇳 BÀI 7 - TỪ MỚI</h1>

  <div class="progress" id="progress"></div>

  <div class="card-wrap" id="cardWrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="face front">
        <div class="han zh" id="frontHan"></div>
      </div>
      <div class="face back">
        <div class="han zh" id="backHan"></div>
        <div class="pinyin" id="pinyin"></div>
        <div class="pos" id="pos"></div>
        <div class="meaning" id="meaning"></div>
        <div class="note" id="note" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="event.stopPropagation();prevCard()">← Trước</button>
    <button class="primary" onclick="event.stopPropagation();flipCard()">Lật thẻ</button>
    <button onclick="event.stopPropagation();nextCard()">Tiếp →</button>
  </div>
  <div class="extra">
    <button class="speak" onclick="event.stopPropagation();speak()">🔊 Nghe phát âm</button>
    <button class="shuffle" onclick="event.stopPropagation();shuffleCards()">🔀 Trộn từ</button>
  </div>
</div>

<script>
const originalCards = [
  { "han": "学院", "pinyin": "xuéyuàn", "pos": "danh từ", "meaning": "học viện", "note": "" },
  { "han": "发", "pinyin": "fā", "pos": "động từ", "meaning": "phát, gửi đi", "note": "" },
  { "han": "旅行", "pinyin": "lǚxíng", "pos": "động từ", "meaning": "du lịch", "note": "" },
  { "han": "计划", "pinyin": "jìhuà", "pos": "danh từ, động từ", "meaning": "kế hoạch; lên kế hoạch", "note": "" },
  { "han": "商量", "pinyin": "shāngliang", "pos": "động từ", "meaning": "bàn bạc", "note": "" },
  { "han": "除了…以外", "pinyin": "chúle…yǐwài", "pos": "", "meaning": "ngoài…ra", "note": "" },
  { "han": "部分", "pinyin": "bùfen", "pos": "danh từ", "meaning": "bộ phận, phần", "note": "" },
  { "han": "草原", "pinyin": "cǎoyuán", "pos": "danh từ", "meaning": "thảo nguyên", "note": "" },
  { "han": "景色", "pinyin": "jǐngsè", "pos": "danh từ", "meaning": "cảnh sắc", "note": "" },
  { "han": "说实话", "pinyin": "shuō shíhuà", "pos": "", "meaning": "nói thật", "note": "" },
  { "han": "兴趣", "pinyin": "xìngqù", "pos": "danh từ", "meaning": "hứng thú", "note": "" },
  { "han": "游览", "pinyin": "yóulǎn", "pos": "động từ", "meaning": "tham quan", "note": "" },
  { "han": "名胜", "pinyin": "míngshèng", "pos": "danh từ", "meaning": "danh lam thắng cảnh", "note": "" },
  { "han": "古迹", "pinyin": "gǔjì", "pos": "danh từ", "meaning": "di tích cổ", "note": "" },
  { "han": "石窟", "pinyin": "shíkū", "pos": "danh từ", "meaning": "hang đá", "note": "" },
  { "han": "具体", "pinyin": "jùtǐ", "pos": "tính từ", "meaning": "cụ thể", "note": "" },
  { "han": "报名", "pinyin": "bào míng", "pos": "", "meaning": "đăng kí", "note": "" },
  { "han": "丰富", "pinyin": "fēngfù", "pos": "tính từ", "meaning": "phong phú", "note": "" },
  { "han": "组织", "pinyin": "zǔzhī", "pos": "động từ", "meaning": "tổ chức", "note": "" },
  { "han": "外地", "pinyin": "wàidì", "pos": "danh từ", "meaning": "nơi khác", "note": "" },
  { "han": "旅游", "pinyin": "lǚyóu", "pos": "động từ", "meaning": "du lịch", "note": "" },
  { "han": "份", "pinyin": "fèn", "pos": "lượng từ", "meaning": "phần, bản", "note": "" },
  { "han": "内容", "pinyin": "nèiróng", "pos": "danh từ", "meaning": "nội dung", "note": "" },
  { "han": "讨论", "pinyin": "tǎolùn", "pos": "động từ", "meaning": "thảo luận", "note": "" },
  { "han": "自然", "pinyin": "zìrán", "pos": "danh từ, tính từ", "meaning": "tự nhiên", "note": "" },
  { "han": "风光", "pinyin": "fēngguāng", "pos": "danh từ", "meaning": "phong cảnh", "note": "" },
  { "han": "武术", "pinyin": "wǔshù", "pos": "danh từ", "meaning": "võ thuật", "note": "" },
  { "han": "路线", "pinyin": "lùxiàn", "pos": "danh từ", "meaning": "tuyến đường", "note": "" },
  { "han": "洛阳", "pinyin": "Luòyáng", "pos": "danh từ riêng", "meaning": "Lạc Dương", "note": "" },
  { "han": "大同", "pinyin": "Dàtóng", "pos": "danh từ riêng", "meaning": "Đại Đồng", "note": "" },
  { "han": "龙门石窟", "pinyin": "Lóngmén Shíkū", "pos": "danh từ riêng", "meaning": "hang đá Long Môn", "note": "" },
  { "han": "少林寺", "pinyin": "Shàolín Sì", "pos": "danh từ riêng", "meaning": "chùa Thiếu Lâm", "note": "" },
  { "han": "云冈石窟", "pinyin": "Yúngāng Shíkū", "pos": "danh từ riêng", "meaning": "hang đá Vân Cương", "note": "" },
  { "han": "内蒙古", "pinyin": "Nèiměnggǔ", "pos": "danh từ riêng", "meaning": "Nội Mông", "note": "" }
];

let cards = [...originalCards];
let index = 0;
let flipped = false;

function render(){
  const c = cards[index];
  document.getElementById('frontHan').textContent = c.han;
  document.getElementById('backHan').textContent = c.han;
  document.getElementById('pinyin').textContent = c.pinyin;
  document.getElementById('pos').textContent = c.pos;
  document.getElementById('meaning').innerHTML = c.meaning;
  
  const noteEl = document.getElementById('note');
  if(c.note && c.note.trim() !== ""){
    noteEl.innerHTML = c.note;
    noteEl.style.display = "block";
  } else {
    noteEl.style.display = "none";
  }

  document.getElementById('progress').textContent = `Từ ${index+1} / ${cards.length}`;
  document.getElementById('card').classList.toggle('flipped', flipped);
}

function flipCard(){
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
}

function nextCard(){
  index = (index + 1) % cards.length;
  flipped = false; render();
}

function prevCard(){
  index = (index - 1 + cards.length) % cards.length;
  flipped = false; render();
}

function shuffleCards(){
  for(let i=cards.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [cards[i],cards[j]]=[cards[j],cards[i]];
  }
  index=0; flipped=false; render();
}

function speak(){
  const text=cards[index].han;
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=.75;
    speechSynthesis.speak(u);
  }else{
    alert('Trình duyệt của bạn không hỗ trợ phát âm.');
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') nextCard();
  else if(e.key==='ArrowLeft') prevCard();
  else if(e.key===' ' || e.key==='Enter'){
    e.preventDefault();
    flipCard();
  }
});

render();
</script>
</body>
</html>
